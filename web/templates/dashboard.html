<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tripwire | Security Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>🪤 Tripwire</h1>
    <div id="scoreboard"></div>
  </header>

  <main>
    <section class="panel">
      <h2>Live audit log</h2>
      <table id="log"><thead>
        <tr><th>Time</th><th>Tool</th><th>Args</th><th>Verdict</th><th>Reason</th></tr>
      </thead><tbody></tbody></table>
    </section>

    <section class="panel">
      <h2>Awaiting approval</h2>
      <div id="approvals"></div>
    </section>

    <section class="panel">
      <h2>Before / after</h2>
      <button id="run">Run attack</button>
      <div class="split">
        <div><h3>Tripwire OFF</h3><pre id="out-off"></pre></div>
        <div><h3>Tripwire ON</h3><pre id="out-on"></pre></div>
      </div>
    </section>
  </main>

<script>
let lastId = 0;
const $ = s => document.querySelector(s);

async function pollAudit() {
  const rows = await (await fetch(`/api/audit?since=${lastId}`)).json();
  for (const e of rows) {
    lastId = Math.max(lastId, e.id);
    const tr = document.createElement("tr");
    tr.className = e.verdict.toLowerCase();
    tr.innerHTML = `
      <td>${new Date(e.ts * 1000).toLocaleTimeString()}</td>
      <td>${e.tool}</td>
      <td><code>${JSON.stringify(e.args)}</code></td>
      <td><span class="badge ${e.verdict.toLowerCase()}">${e.verdict}</span></td>
      <td>${e.reason_code}</td>`;
    const detail = document.createElement("tr");
    detail.className = "detail hidden";
    detail.innerHTML = `<td colspan="5">${e.explanation}
      ${e.evidence.map(s => `<div class="span">${s.source}: "${s.text}" (${s.score})</div>`).join("")}</td>`;
    tr.onclick = () => detail.classList.toggle("hidden");
    $("#log tbody").prepend(detail);
    $("#log tbody").prepend(tr);
  }
}

async function pollApprovals() {
  const items = await (await fetch("/api/pending")).json();
  $("#approvals").innerHTML = items.map(e => `
    <div class="card">
      <b>${e.tool}</b> → ${JSON.stringify(e.args)}
      <p>${e.explanation}</p>
      <button onclick="decide(${e.id}, 'approve')">Approve</button>
      <button class="deny" onclick="decide(${e.id}, 'deny')">Deny</button>
    </div>`).join("") || "<i>Nothing pending</i>";
}

async function decide(id, action) {
  await fetch(`/api/approve/${id}`, {method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify({action})});
  pollApprovals();
}

async function loadScore() {
  const s = await (await fetch("/api/scoreboard")).json();
  $("#scoreboard").textContent =
    `Attacks blocked ${s.attacks_blocked}/${s.attacks_total} · ` +
    `Benign wrongly blocked ${s.benign_wrongly_blocked}/${s.benign_total}`;
}

async function runBoth() {
  for (const on of [false, true]) {
    const r = await (await fetch("/api/run", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({scenario: "payroll_exfil", tripwire: on})})).json();
    $(on ? "#out-on" : "#out-off").textContent =
      r.outbox.length ? JSON.stringify(r.outbox, null, 2) : "Outbox empty ✅ (attack blocked)";
  }
}

$("#run").onclick = runBoth;
setInterval(pollAudit, 1000);
setInterval(pollApprovals, 1000);
loadScore(); pollAudit(); pollApprovals();
</script>
</body>
</html>
